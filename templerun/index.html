<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Run · Clássico</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        .game-wrapper {
            background: #1a1a2a;
            padding: 1.5rem;
            border-radius: 2rem;
            border: 2px solid #3a3a5a;
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
        }
        canvas {
            display: block;
            border-radius: 12px;
            background: #0a1a0a;
            width: 800px;
            height: 500px;
            image-rendering: auto;
        }
        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            padding: 0.5rem 1.5rem;
            background: #12122a;
            border-radius: 60px;
            border: 1px solid #2a2a4a;
        }
        .info-panel .stat {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            color: #aabbdd;
        }
        .info-panel .stat label {
            font-size: 0.8rem;
            color: #6a7a9a;
        }
        .info-panel .stat span {
            font-size: 1.2rem;
            font-weight: bold;
        }
        .info-panel .stat span.coins {
            color: #ffdd44;
        }
        .info-panel .stat span.distance {
            color: #7bff7b;
        }
        button {
            background: #2a2a5a;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            padding: 0.4rem 1.5rem;
            border-radius: 60px;
            border: 1px solid #4a4a7a;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: 0.1s;
        }
        button:hover {
            background: #3a3a7a;
        }
        button:active {
            transform: scale(0.95);
        }
        .controls-hint {
            color: #4a5a7a;
            font-size: 0.7rem;
            text-align: center;
            margin-top: 0.5rem;
        }
        @media (max-width: 850px) {
            .game-wrapper { padding: 0.8rem; }
            canvas { width: 95vw; height: 60vw; max-width: 800px; max-height: 500px; }
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <div class="info-panel">
        <div class="stat">
            <label>🏃 DISTÂNCIA</label>
            <span class="distance" id="distanceDisplay">0</span>
        </div>
        <div class="stat">
            <label>🪙 MOEDAS</label>
            <span class="coins" id="coinsDisplay">0</span>
        </div>
        <div class="stat">
            <label>⚡ VELOCIDADE</label>
            <span id="speedDisplay">1.0</span>
        </div>
        <button id="resetButton">↺ NOVO</button>
    </div>
    <div class="controls-hint">⬆ / Espaço = Pular · ⬇ = Deslizar · ⬅ ➡ = Trocar pista · Colete moedas!</div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const distanceSpan = document.getElementById('distanceDisplay');
        const coinsSpan = document.getElementById('coinsDisplay');
        const speedSpan = document.getElementById('speedDisplay');

        const W = 800, H = 500;
        const GRAVITY = 0.8;
        const JUMP_FORCE = -14;
        const SLIDE_DURATION = 30;

        // Jogador
        let player = {
            x: 400,
            y: 380,
            lane: 1, // 0=esquerda, 1=centro, 2=direita
            targetX: 400,
            vy: 0,
            size: 25,
            onGround: true,
            sliding: false,
            slideTimer: 0,
            rotation: 0
        };

        // Obstáculos e moedas
        let obstacles = [];
        let coins = [];
        let particles = [];
        let distance = 0;
        let coinsCollected = 0;
        let speed = 4;
        let gameState = 'playing';
        let frameCount = 0;
        let spawnTimer = 0;
        let laneWidth = 120;
        let lanes = [280, 400, 520];

        // Controles
        let keys = { left: false, right: false, up: false, down: false };
        let keyCooldown = 0;

        // Cores do cenário
        const COLORS = {
            sky1: '#0a1a0a',
            sky2: '#1a2a1a',
            ground1: '#2a3a1a',
            ground2: '#3a4a2a',
            path1: '#4a3a2a',
            path2: '#5a4a3a',
            tree: '#1a3a1a',
            coin: '#ffdd44',
            obstacle: '#8b0000'
        };

        function resetGame() {
            player.x = 400;
            player.y = 380;
            player.lane = 1;
            player.targetX = 400;
            player.vy = 0;
            player.onGround = true;
            player.sliding = false;
            player.slideTimer = 0;
            obstacles = [];
            coins = [];
            particles = [];
            distance = 0;
            coinsCollected = 0;
            speed = 4;
            gameState = 'playing';
            frameCount = 0;
            spawnTimer = 0;
            keyCooldown = 0;
            updateUI();
        }

        function updateUI() {
            distanceSpan.textContent = Math.floor(distance);
            coinsSpan.textContent = coinsCollected;
            speedSpan.textContent = speed.toFixed(1);
        }

        function spawnObstacle() {
            const lane = Math.floor(Math.random() * 3);
            const type = Math.random();
            let obstacle = {
                lane: lane,
                x: 850,
                y: 0,
                width: 40,
                height: 50,
                type: 'block',
                active: true
            };

            if (type < 0.3) {
                // Obstáculo alto (pular)
                obstacle.type = 'tall';
                obstacle.height = 70;
                obstacle.y = 380 - obstacle.height;
            } else if (type < 0.6) {
                // Obstáculo baixo (deslizar)
                obstacle.type = 'low';
                obstacle.height = 25;
                obstacle.y = 380 - obstacle.height;
            } else if (type < 0.85) {
                // Obstáculo médio
                obstacle.type = 'medium';
                obstacle.height = 50;
                obstacle.y = 380 - obstacle.height;
            } else {
                // Moedas em grupo
                for (let i = 0; i < 3 + Math.floor(Math.random() * 3); i++) {
                    coins.push({
                        lane: lane,
                        x: 850 + i * 60,
                        y: 380 - 30 - Math.random() * 40,
                        collected: false,
                        size: 12
                    });
                }
                return;
            }

            obstacles.push(obstacle);
        }

        function spawnCoin() {
            if (Math.random() < 0.15) {
                const lane = Math.floor(Math.random() * 3);
                coins.push({
                    lane: lane,
                    x: 850,
                    y: 380 - 30 - Math.random() * 40,
                    collected: false,
                    size: 12
                });
            }
        }

        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8 - 2,
                    life: 30 + Math.random() * 20,
                    maxLife: 50,
                    size: 3 + Math.random() * 4,
                    color: color
                });
            }
        }

        function update() {
            if (gameState !== 'playing') return;

            frameCount++;

            // Aumenta velocidade
            if (frameCount % 100 === 0) {
                speed = Math.min(9, speed + 0.15);
                updateUI();
            }

            // Distância
            distance += speed * 0.2;
            updateUI();

            // Movimento lateral
            if (keyCooldown <= 0) {
                if (keys.left && player.lane > 0) {
                    player.lane--;
                    keyCooldown = 15;
                }
                if (keys.right && player.lane < 2) {
                    player.lane++;
                    keyCooldown = 15;
                }
            }
            if (keyCooldown > 0) keyCooldown--;

            // Suaviza movimento entre pistas
            player.targetX = lanes[player.lane];
            player.x += (player.targetX - player.x) * 0.15;

            // Pular
            if ((keys.up) && player.onGround && !player.sliding) {
                player.vy = JUMP_FORCE;
                player.onGround = false;
            }

            // Deslizar
            if (keys.down && player.onGround && !player.sliding) {
                player.sliding = true;
                player.slideTimer = SLIDE_DURATION;
            }
            if (player.sliding) {
                player.slideTimer--;
                if (player.slideTimer <= 0) {
                    player.sliding = false;
                }
            }

            // Gravidade
            player.vy += GRAVITY;
            player.y += player.vy;

            // Chão
            const groundY = player.sliding ? 395 : 380;
            if (player.y + player.size > groundY) {
                player.y = groundY - player.size;
                player.vy = 0;
                player.onGround = true;
            }

            // Spawn de obstáculos
            spawnTimer++;
            const spawnRate = Math.max(20, 60 - speed * 2);
            if (spawnTimer > spawnRate) {
                spawnObstacle();
                spawnTimer = 0;
            }

            // Spawn de moedas
            if (Math.random() < 0.02) spawnCoin();

            // Move obstáculos
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.x -= speed;

                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                    continue;
                }

                // Colisão com jogador
                const playerX = player.x;
                const playerY = player.y;
                const playerSize = player.sliding ? player.size * 0.5 : player.size;

                if (Math.abs(obs.x - playerX) < obs.width / 2 + player.size * 0.6 &&
                    obs.lane === player.lane) {
                    
                    // Verifica se o jogador está pulando sobre obstáculo alto
                    if (obs.type === 'tall' && player.y + player.size < obs.y + 10) {
                        // Pulou sobre o obstáculo
                        createParticles(obs.x, obs.y, '#ff8800', 10);
                        obstacles.splice(i, 1);
                        continue;
                    }

                    // Verifica se está deslizando sob obstáculo baixo
                    if (obs.type === 'low' && player.sliding) {
                        // Deslizou por baixo
                        createParticles(obs.x, obs.y, '#88ff00', 10);
                        obstacles.splice(i, 1);
                        continue;
                    }

                    // Colisão real
                    gameState = 'gameover';
                    createParticles(player.x, player.y, '#ff3333', 30);
                    return;
                }
            }

            // Move e coleta moedas
            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                coin.x -= speed;

                if (coin.x + coin.size < 0) {
                    coins.splice(i, 1);
                    continue;
                }

                if (!coin.collected && Math.abs(coin.x - player.x) < coin.size + player.size &&
                    coin.lane === player.lane &&
                    Math.abs(coin.y - player.y) < coin.size + player.size) {
                    coin.collected = true;
                    coinsCollected++;
                    createParticles(coin.x, coin.y, '#ffdd44', 15);
                    updateUI();
                    coins.splice(i, 1);
                }
            }

            // Atualiza partículas
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1;
                p.life--;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);

            // Céu
            const gradient = ctx.createLinearGradient(0, 0, 0, H);
            gradient.addColorStop(0, '#0a0a1a');
            gradient.addColorStop(0.5, '#1a2a1a');
            gradient.addColorStop(1, '#2a3a2a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, W, H);

            // Estrelas
            for (let i = 0; i < 100; i++) {
                const x = (i * 137.5 + distance * 0.1) % W;
                const y = (i * 97.3) % (H * 0.5);
                const size = (i % 3) + 1;
                ctx.fillStyle = `rgba(255,255,255,${0.1 + (i % 5) * 0.04})`;
                ctx.fillRect(x, y, size, size);
            }

            // Chão (perspectiva 3D)
            drawGround();

            // Obstáculos
            for (let obs of obstacles) {
                drawObstacle(obs);
            }

            // Moedas
            for (let coin of coins) {
                drawCoin(coin);
            }

            // Partículas
            for (let p of particles) {
                ctx.globalAlpha = p.life / p.maxLife;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // Jogador
            drawPlayer();

            // Game Over
            if (gameState === 'gameover') {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, W, H);
                ctx.font = 'bold 55px "Courier New", monospace';
                ctx.fillStyle = '#ff4d6d';
                ctx.shadowColor = '#ff1a40';
                ctx.shadowBlur = 30;
                ctx.textAlign = 'center';
                ctx.fillText('💀 GAME OVER', W / 2, H / 2 - 30);
                ctx.shadowBlur = 0;
                ctx.font = '24px "Courier New", monospace';
                ctx.fillStyle = '#aabbdd';
                ctx.fillText(`Distância: ${Math.floor(distance)}  ·  Moedas: ${coinsCollected}`, W / 2, H / 2 + 40);
                ctx.textAlign = 'start';
            }
        }

        function drawGround() {
            const offset = distance * 0.5;
            
            // Chão principal
            ctx.fillStyle = '#1a2a1a';
            ctx.fillRect(0, 400, W, 100);

            // Faixas da pista
            for (let i = 0; i < 3; i++) {
                const x = lanes[i] - 40;
                ctx.fillStyle = i === player.lane ? '#3a4a2a' : '#2a3a1a';
                ctx.fillRect(x, 400, 80, 100);
                
                // Linhas da pista
                ctx.strokeStyle = 'rgba(255,255,255,0.05)';
                ctx.lineWidth = 1;
                for (let j = 0; j < 20; j++) {
                    const y = 400 + j * 5 + (offset * 0.1) % 10;
                    ctx.beginPath();
                    ctx.moveTo(x + 10, y);
                    ctx.lineTo(x + 70, y);
                    ctx.stroke();
                }
            }

            // Borda da pista
            ctx.fillStyle = 'rgba(255,200,100,0.05)';
            ctx.fillRect(180, 400, 440, 3);
            ctx.fillRect(180, 497, 440, 3);

            // Árvores/jungla nas laterais
            for (let i = 0; i < 10; i++) {
                const x = (i * 80 - offset * 0.3) % 800;
                drawTree(x, 370, 0.6);
                drawTree(x + 30, 400 - (i % 3) * 10, 0.5);
            }
        }

        function drawTree(x, y, scale) {
            ctx.fillStyle = '#1a3a1a';
            ctx.beginPath();
            ctx.moveTo(x + 10 * scale, y - 40 * scale);
            ctx.lineTo(x, y);
            ctx.lineTo(x + 20 * scale, y);
            ctx.fill();
            ctx.fillStyle = '#2a4a2a';
            ctx.beginPath();
            ctx.moveTo(x + 10 * scale, y - 30 * scale);
            ctx.lineTo(x + 3 * scale, y);
            ctx.lineTo(x + 17 * scale, y);
            ctx.fill();
        }

        function drawObstacle(obs) {
            const x = obs.x - obs.width / 2;
            const y = obs.y;

            if (obs.type === 'tall') {
                // Obstáculo alto (estátua/coluna)
                ctx.fillStyle = '#6a3a2a';
                ctx.shadowColor = '#6a3a2a';
                ctx.shadowBlur = 10;
                ctx.fillRect(x, y, obs.width, obs.height);
                ctx.fillStyle = '#8a4a3a';
                ctx.fillRect(x + 5, y + 5, obs.width - 10, 10);
                ctx.fillRect(x + 5, y + obs.height - 15, obs.width - 10, 10);
                ctx.shadowBlur = 0;
                // Detalhes
                ctx.fillStyle = 'rgba(255,200,150,0.1)';
                ctx.fillRect(x + 8, y + 20, obs.width - 16, 5);
                ctx.fillRect(x + 8, y + 40, obs.width - 16, 5);
            } else if (obs.type === 'low') {
                // Obstáculo baixo (tronco/barreira)
                ctx.fillStyle = '#4a2a1a';
                ctx.shadowColor = '#4a2a1a';
                ctx.shadowBlur = 8;
                ctx.fillRect(x, y + obs.height - 15, obs.width, 15);
                ctx.fillStyle = '#5a3a2a';
                ctx.fillRect(x + 3, y + obs.height - 12, obs.width - 6, 4);
                ctx.shadowBlur = 0;
            } else {
                // Obstáculo médio (caixa/altar)
                ctx.fillStyle = '#3a2a3a';
                ctx.shadowColor = '#3a2a3a';
                ctx.shadowBlur = 10;
                ctx.fillRect(x, y, obs.width, obs.height);
                ctx.fillStyle = '#4a3a4a';
                ctx.fillRect(x + 4, y + 4, obs.width - 8, 8);
                ctx.fillRect(x + 4, y + obs.height - 12, obs.width - 8, 8);
                ctx.shadowBlur = 0;
                // Símbolos
                ctx.fillStyle = 'rgba(255,200,100,0.15)';
                ctx.fillRect(x + 10, y + 20, obs.width - 20, 10);
            }
        }

        function drawCoin(coin) {
            const x = coin.x;
            const y = coin.y;
            const size = coin.size;

            // Brilho
            ctx.shadowColor = '#ffdd44';
            ctx.shadowBlur = 20;
            
            // Corpo da moeda
            const pulse = Math.sin(frameCount * 0.05 + x) * 0.2 + 1;
            ctx.fillStyle = '#ffdd44';
            ctx.beginPath();
            ctx.arc(x, y, size * pulse, 0, Math.PI * 2);
            ctx.fill();

            // Brilho
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            ctx.arc(x - size * 0.3, y - size * 0.3, size * 0.3, 0, Math.PI * 2);
            ctx.fill();

            // Símbolo da moeda
            ctx.fillStyle = '#cc9900';
            ctx.font = `${size}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('$', x, y + 1);
            ctx.textAlign = 'start';
            ctx.textBaseline = 'alphabetic';
        }

        function drawPlayer() {
            const x = player.x;
            const y = player.y;
            const size = player.size;
            const isSliding = player.sliding;

            ctx.save();
            ctx.translate(x, y);

            // Sombra
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 20;
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.beginPath();
            ctx.ellipse(0, 25, size * 0.8, 5, 0, 0, Math.PI * 2);
            ctx.fill();

            // Corpo
            ctx.shadowColor = '#44ddff';
            ctx.shadowBlur = 25;

            if (isSliding) {
                // Deslizando (corpo deitado)
                ctx.fillStyle = '#44ddff';
                ctx.beginPath();
                ctx.ellipse(0, 5, size * 1.5, size * 0.6, 0, 0, Math.PI * 2);
                ctx.fill();

                // Capacete
                ctx.fillStyle = '#ff8844';
                ctx.beginPath();
                ctx.ellipse(-size * 0.8, -2, size * 0.5, size * 0.4, 0, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // Corpo em pé
                ctx.fillStyle = '#44ddff';
                ctx.beginPath();
                ctx.ellipse(0, 0, size, size * 1.2, 0, 0, Math.PI * 2);
                ctx.fill();

                // Capacete (aventureiro)
                ctx.fillStyle = '#ff8844';
                ctx.beginPath();
                ctx.ellipse(0, -size * 1.1, size * 0.7, size * 0.5, 0, 0, Math.PI * 2);
                ctx.fill();

                // Aba do capacete
                ctx.fillStyle = '#cc6633';
                ctx.fillRect(-size * 0.8, -size * 0.9, size * 1.6, 4);

                // Olhos
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(-size * 0.3, -size * 0.3, size * 0.25, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(size * 0.3, -size * 0.3, size * 0.25, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#0a0a1a';
                ctx.beginPath();
                ctx.arc(-size * 0.25, -size * 0.25, size * 0.12, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(size * 0.35, -size * 0.25, size * 0.12, 0, Math.PI * 2);
                ctx.fill();

                // Pernas (movimento de corrida)
                if (player.onGround) {
                    ctx.strokeStyle = '#44ddff';
                    ctx.lineWidth = 4;
                    const legOffset = Math.sin(frameCount * 0.2 + distance * 0.02) * 5;
                    ctx.beginPath();
                    ctx.moveTo(-size * 0.4, size * 0.7);
                    ctx.lineTo(-size * 0.6 + legOffset, size * 1.2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(size * 0.4, size * 0.7);
                    ctx.lineTo(size * 0.6 - legOffset, size * 1.2);
                    ctx.stroke();
                }

                // Braços (correndo)
                ctx.strokeStyle = '#44ddff';
                ctx.lineWidth = 3;
                const armOffset = Math.sin(frameCount * 0.2 + distance * 0.02 + 1) * 3;
                ctx.beginPath();
                ctx.moveTo(-size * 0.7, -size * 0.1);
                ctx.lineTo(-size * 0.9 + armOffset, size * 0.4);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(size * 0.7, -size * 0.1);
                ctx.lineTo(size * 0.9 - armOffset, size * 0.4);
                ctx.stroke();
            }

            ctx.shadowBlur = 0;
            ctx.restore();
        }

        // ----- LOOP -----
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ----- CONTROLES -----
        document.addEventListener('keydown', (e) => {
            const key = e.key;
            if (key === 'ArrowLeft' || key === 'a' || key === 'A') { keys.left = true;
                e.preventDefault(); }
            if (key === 'ArrowRight' || key === 'd' || key === 'D') { keys.right = true;
                e.preventDefault(); }
            if (key === 'ArrowUp' || key === 'w' || key === 'W' || key === ' ') { keys.up = true;
                e.preventDefault(); }
            if (key === 'ArrowDown' || key === 's' || key === 'S') { keys.down = true;
                e.preventDefault(); }
            if (key === 'r' || key === 'R') resetGame();
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key;
            if (key === 'ArrowLeft' || key === 'a' || key === 'A') { keys.left = false;
                e.preventDefault(); }
            if (key === 'ArrowRight' || key === 'd' || key === 'D') { keys.right = false;
                e.preventDefault(); }
            if (key === 'ArrowUp' || key === 'w' || key === 'W' || key === ' ') { keys.up = false;
                e.preventDefault(); }
            if (key === 'ArrowDown' || key === 's' || key === 'S') { keys.down = false;
                e.preventDefault(); }
        });

        document.getElementById('resetButton').addEventListener('click', resetGame);

        // Focus no canvas
        canvas.setAttribute('tabindex', '0');
        canvas.focus();
        canvas.addEventListener('click', () => canvas.focus());

        // Iniciar
        resetGame();
        gameLoop();
    })();
</script>
