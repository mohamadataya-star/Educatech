<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 · Clássico</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: #0a0a1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Arial', sans-serif; }
        .game-wrapper { background: #1a1a2e; padding: 2rem; border-radius: 2rem; border: 2px solid #3a3a5a; box-shadow: 0 20px 40px rgba(0,0,0,0.8); text-align: center; }
        canvas { display: block; margin: 0 auto; border-radius: 16px; background: #0a0a1a; width: 450px; height: 450px; box-shadow: inset 0 0 30px rgba(100, 100, 255, 0.05); }
        .info-panel { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; padding: 0.5rem 1.5rem; background: #12122a; border-radius: 60px; border: 1px solid #2a2a4a; color: #aabbdd; flex-wrap: wrap; gap: 0.5rem; }
        .info-panel .stat { display: flex; gap: 0.8rem; align-items: center; }
        .info-panel .stat label { font-size: 0.8rem; color: #6a7a9a; }
        .info-panel .stat span { font-size: 1.2rem; font-weight: bold; }
        .info-panel .stat span.score { color: #f7e05e; }
        .info-panel .stat span.best { color: #44ddff; }
        button { background: #2a2a5a; border: none; color: white; font-weight: bold; font-size: 0.9rem; padding: 0.4rem 1.2rem; border-radius: 60px; border: 1px solid #4a4a7a; cursor: pointer; font-family: 'Courier New', monospace; transition: 0.1s; }
        button:hover { background: #3a3a7a; transform: scale(1.02); }
        button:active { transform: scale(0.95); }
        .controls-hint { color: #4a5a7a; font-size: 0.7rem; text-align: center; margin-top: 0.5rem; }
        @media (max-width: 500px) { .game-wrapper { padding: 1rem; } canvas { width: 90vw; height: 90vw; max-width: 450px; max-height: 450px; } }
    </style>
</head>
<body>
<div class="game-wrapper">
    <canvas id="gameCanvas" width="450" height="450"></canvas>
    <div class="info-panel">
        <div class="stat"><label>🎯 PONTOS</label><span class="score" id="scoreDisplay">0</span></div>
        <div class="stat"><label>🏆 RECORDE</label><span class="best" id="bestDisplay">0</span></div>
        <button id="resetButton">↺ NOVO</button>
    </div>
    <div class="controls-hint">⬆ ⬇ ⬅ ➡ para mover · Junte os números até chegar no 2048!</div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');
        const bestSpan = document.getElementById('bestDisplay');

        const SIZE = 450;
        const CELL_SIZE = SIZE / 4;
        const PADDING = 10;
        const GRID_SIZE = 4;

        // Cores dos números
        const COLORS = {
            0: { bg: '#1a1a2e', text: '#1a1a2e' },
            2: { bg: '#2a2a4a', text: '#aabbdd' },
            4: { bg: '#3a3a6a', text: '#aabbdd' },
            8: { bg: '#ff8844', text: '#ffffff' },
            16: { bg: '#ff6633', text: '#ffffff' },
            32: { bg: '#ff4444', text: '#ffffff' },
            64: { bg: '#ff2244', text: '#ffffff' },
            128: { bg: '#ff44aa', text: '#ffffff' },
            256: { bg: '#dd44ff', text: '#ffffff' },
            512: { bg: '#aa44ff', text: '#ffffff' },
            1024: { bg: '#6644ff', text: '#ffffff' },
            2048: { bg: '#44ddff', text: '#ffffff' },
            4096: { bg: '#44ff88', text: '#ffffff' },
            8192: { bg: '#44ff44', text: '#ffffff' }
        };

        // ========== ESTADO ==========
        let grid = [];
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('2048best')) || 0;
        let gameState = 'playing';
        let isMoving = false;

        // ========== FUNÇÕES ==========
        function resetGame() {
            grid = [];
            for (let row = 0; row < GRID_SIZE; row++) {
                grid.push(new Array(GRID_SIZE).fill(0));
            }
            score = 0;
            gameState = 'playing';
            isMoving = false;
            addRandomTile();
            addRandomTile();
            updateUI();
            draw();
        }

        function updateUI() {
            scoreSpan.textContent = score;
            bestSpan.textContent = bestScore;
        }

        function addRandomTile() {
            let empty = [];
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    if (grid[row][col] === 0) {
                        empty.push({ row, col });
                    }
                }
            }
            if (empty.length === 0) return;
            const pos = empty[Math.floor(Math.random() * empty.length)];
            grid[pos.row][pos.col] = Math.random() < 0.9 ? 2 : 4;
        }

        function getEmptyCount() {
            let count = 0;
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    if (grid[row][col] === 0) count++;
                }
            }
            return count;
        }

        function checkGameOver() {
            // Verifica se há movimentos possíveis
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    if (grid[row][col] === 0) return false;
                    if (col < GRID_SIZE - 1 && grid[row][col] === grid[row][col + 1]) return false;
                    if (row < GRID_SIZE - 1 && grid[row][col] === grid[row + 1][col]) return false;
                }
            }
            return true;
        }

        // ========== MOVIMENTOS ==========
        function slideRow(row) {
            // Remove zeros
            let newRow = row.filter(val => val !== 0);
            // Combina
            let merged = [];
            let scoreGain = 0;
            for (let i = 0; i < newRow.length; i++) {
                if (i + 1 < newRow.length && newRow[i] === newRow[i + 1]) {
                    merged.push(newRow[i] * 2);
                    scoreGain += newRow[i] * 2;
                    i++;
                } else {
                    merged.push(newRow[i]);
                }
            }
            // Preenche com zeros
            while (merged.length < GRID_SIZE) {
                merged.push(0);
            }
            return { row: merged, score: scoreGain };
        }

        function moveLeft() {
            let moved = false;
            let totalScore = 0;
            for (let row = 0; row < GRID_SIZE; row++) {
                const result = slideRow(grid[row]);
                if (result.row.join(',') !== grid[row].join(',')) moved = true;
                grid[row] = result.row;
                totalScore += result.score;
            }
            return { moved, score: totalScore };
        }

        function moveRight() {
            let moved = false;
            let totalScore = 0;
            for (let row = 0; row < GRID_SIZE; row++) {
                const reversed = [...grid[row]].reverse();
                const result = slideRow(reversed);
                const newRow = result.row.reverse();
                if (newRow.join(',') !== grid[row].join(',')) moved = true;
                grid[row] = newRow;
                totalScore += result.score;
            }
            return { moved, score: totalScore };
        }

        function moveUp() {
            let moved = false;
            let totalScore = 0;
            for (let col = 0; col < GRID_SIZE; col++) {
                let column = [];
                for (let row = 0; row < GRID_SIZE; row++) {
                    column.push(grid[row][col]);
                }
                const result = slideRow(column);
                const newColumn = result.row;
                for (let row = 0; row < GRID_SIZE; row++) {
                    if (grid[row][col] !== newColumn[row]) moved = true;
                    grid[row][col] = newColumn[row];
                }
                totalScore += result.score;
            }
            return { moved, score: totalScore };
        }

        function moveDown() {
            let moved = false;
            let totalScore = 0;
            for (let col = 0; col < GRID_SIZE; col++) {
                let column = [];
                for (let row = GRID_SIZE - 1; row >= 0; row--) {
                    column.push(grid[row][col]);
                }
                const result = slideRow(column);
                const newColumn = result.row.reverse();
                for (let row = 0; row < GRID_SIZE; row++) {
                    if (grid[row][col] !== newColumn[row]) moved = true;
                    grid[row][col] = newColumn[row];
                }
                totalScore += result.score;
            }
            return { moved, score: totalScore };
        }

        function makeMove(direction) {
            if (gameState !== 'playing' || isMoving) return;

            let result;
            switch (direction) {
                case 'left': result = moveLeft(); break;
                case 'right': result = moveRight(); break;
                case 'up': result = moveUp(); break;
                case 'down': result = moveDown(); break;
                default: return;
            }

            if (result.moved) {
                score += result.score;
                if (score > bestScore) {
                    bestScore = score;
                    localStorage.setItem('2048best', bestScore);
                }
                updateUI();
                addRandomTile();
                draw();

                // Verifica se chegou no 2048
                let has2048 = false;
                for (let row = 0; row < GRID_SIZE; row++) {
                    for (let col = 0; col < GRID_SIZE; col++) {
                        if (grid[row][col] === 2048) has2048 = true;
                    }
                }
                if (has2048) {
                    gameState = 'won';
                    draw();
                    return;
                }

                if (checkGameOver()) {
                    gameState = 'gameover';
                    draw();
                }
            }
        }

        // ========== DESENHO ==========
        function draw() {
            ctx.clearRect(0, 0, SIZE, SIZE);

            // Fundo
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, SIZE, SIZE);

            // Grid
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    const x = col * CELL_SIZE + PADDING;
                    const y = row * CELL_SIZE + PADDING;
                    const w = CELL_SIZE - PADDING * 2;
                    const h = CELL_SIZE - PADDING * 2;
                    const value = grid[row][col];

                    // Fundo da célula
                    const color = COLORS[value] || COLORS[0];
                    ctx.shadowColor = value > 0 ? color.bg : 'transparent';
                    ctx.shadowBlur = value > 0 ? 10 : 0;
                    ctx.fillStyle = color.bg;
                    ctx.beginPath();
                    ctx.roundRect(x, y, w, h, 8);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // Número
                    if (value > 0) {
                        const textColor = color.text;
                        ctx.fillStyle = textColor;
                        ctx.font = `bold ${value >= 1024 ? 28 : value >= 128 ? 32 : 36}px Arial`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(value, x + w/2, y + h/2 + 2);
                    }
                }
            }

            // Mensagens
            if (gameState === 'gameover') {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, SIZE, SIZE);
                ctx.font = 'bold 40px Arial';
                ctx.fillStyle = '#ff4d6d';
                ctx.shadowColor = '#ff1a40';
                ctx.shadowBlur = 30;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('💀 GAME OVER', SIZE/2, SIZE/2 - 20);
                ctx.shadowBlur = 0;
                ctx.font = '18px Arial';
                ctx.fillStyle = '#aabbdd';
                ctx.fillText(`Pontos: ${score}`, SIZE/2, SIZE/2 + 40);
                ctx.textAlign = 'start';
                ctx.textBaseline = 'alphabetic';
            } else if (gameState === 'won') {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, SIZE, SIZE);
                ctx.font = 'bold 40px Arial';
                ctx.fillStyle = '#f7e05e';
                ctx.shadowColor = '#ffbb33';
                ctx.shadowBlur = 30;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🏆 2048!', SIZE/2, SIZE/2 - 20);
                ctx.shadowBlur = 0;
                ctx.font = '18px Arial';
                ctx.fillStyle = '#aabbdd';
                ctx.fillText(`Pontos: ${score}`, SIZE/2, SIZE/2 + 40);
                ctx.textAlign = 'start';
                ctx.textBaseline = 'alphabetic';
            }
        }

        // Polyfill roundRect
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (r > w/2) r = w/2;
                if (r > h/2) r = h/2;
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                return this;
            };
        }

        // ========== CONTROLES ==========
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') { makeMove('up'); e.preventDefault(); }
            if (e.key === 'ArrowDown') { makeMove('down'); e.preventDefault(); }
            if (e.key === 'ArrowLeft') { makeMove('left'); e.preventDefault(); }
            if (e.key === 'ArrowRight') { makeMove('right'); e.preventDefault(); }
            if (e.key === 'r' || e.key === 'R') resetGame();
        });

        // Suporte a touch (swipe)
        let startX = 0, startY = 0;
        canvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            startX = touch.clientX;
            startY = touch.clientY;
            e.preventDefault();
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
        });

        canvas.addEventListener('touchend', (e) => {
            if (startX === 0 && startY === 0) return;
            const endX = e.changedTouches[0].clientX;
            const endY = e.changedTouches[0].clientY;
            const dx = endX - startX;
            const dy = endY - startY;
            const absDx = Math.abs(dx);
            const absDy = Math.abs(dy);

            if (Math.max(absDx, absDy) < 20) return;

            if (absDx > absDy) {
                makeMove(dx > 0 ? 'right' : 'left');
            } else {
                makeMove(dy > 0 ? 'down' : 'up');
            }
            startX = 0;
            startY = 0;
        });

        document.getElementById('resetButton').addEventListener('click', resetGame);

        // ===== LOOP =====
        resetGame();
        bestSpan.textContent = bestScore;

        function loop() {
            draw();
            requestAnimationFrame(loop);
        }
        loop();

        canvas.setAttribute('tabindex', '0');
        canvas.focus();
    })();
</script>
</body>
</html>
