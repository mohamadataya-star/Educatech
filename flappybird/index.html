<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird · Vermelho</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: #0a0a1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Courier New', monospace; }
        .game-wrapper { background: #1a1a2e; padding: 2rem; border-radius: 2rem; border: 2px solid #3a3a5a; box-shadow: 0 20px 40px rgba(0,0,0,0.8); text-align: center; }
        canvas { display: block; margin: 0 auto; border-radius: 16px; background: #0a0a1a; width: 400px; height: 600px; box-shadow: inset 0 0 30px rgba(100, 100, 255, 0.05); }
        .info-panel { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; padding: 0.5rem 1.5rem; background: #12122a; border-radius: 60px; border: 1px solid #2a2a4a; color: #aabbdd; flex-wrap: wrap; gap: 0.5rem; }
        .info-panel .stat { display: flex; gap: 0.8rem; align-items: center; }
        .info-panel .stat label { font-size: 0.8rem; color: #6a7a9a; }
        .info-panel .stat span { font-size: 1.2rem; font-weight: bold; }
        .info-panel .stat span.score { color: #f7e05e; }
        .info-panel .stat span.best { color: #44ddff; }
        button { background: #2a2a5a; border: none; color: white; font-weight: bold; font-size: 0.9rem; padding: 0.4rem 1.2rem; border-radius: 60px; border: 1px solid #4a4a7a; cursor: pointer; font-family: 'Courier New', monospace; transition: 0.1s; }
        button:hover { background: #3a3a7a; transform: scale(1.02); }
        button:active { transform: scale(0.95); }
        .controls-hint { color: #4a5a7a; font-size: 0.7rem; text-align: center; margin-top: 0.5rem; }
        @media (max-width: 450px) { .game-wrapper { padding: 1rem; } canvas { width: 95vw; height: 142vw; max-width: 400px; max-height: 600px; } }
    </style>
</head>
<body>
<div class="game-wrapper">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <div class="info-panel">
        <div class="stat"><label>🎯 PONTOS</label><span class="score" id="scoreDisplay">0</span></div>
        <div class="stat"><label>🏆 RECORDE</label><span class="best" id="bestDisplay">0</span></div>
        <button id="resetButton">↺ NOVO</button>
    </div>
    <div class="controls-hint">Espaço / Clique para pular · Passe pelos canos!</div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');
        const bestSpan = document.getElementById('bestDisplay');

        const W = 400, H = 600;
        const GRAVITY = 0.5;
        const JUMP_FORCE = -8;
        const PIPE_WIDTH = 50;
        const PIPE_GAP = 150;
        const PIPE_SPEED = 2;
        const BIRD_SIZE = 16;
        const GROUND_HEIGHT = 80;

        // ========== ESTADO ==========
        let bird = {
            x: 80,
            y: H/2,
            vy: 0,
            size: BIRD_SIZE,
            rotation: 0
        };
        let pipes = [];
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('flappyBest')) || 0;
        let gameState = 'ready';
        let frameCount = 0;

        // ========== FUNÇÕES ==========
        function resetGame() {
            bird.y = H/2;
            bird.vy = 0;
            bird.rotation = 0;
            pipes = [];
            score = 0;
            gameState = 'ready';
            frameCount = 0;
            updateUI();
        }

        function updateUI() {
            scoreSpan.textContent = score;
            bestSpan.textContent = bestScore;
        }

        function startGame() {
            if (gameState === 'ready') {
                gameState = 'playing';
                bird.vy = JUMP_FORCE;
            }
        }

        function jump() {
            if (gameState === 'ready') {
                startGame();
                return;
            }
            if (gameState === 'playing') {
                bird.vy = JUMP_FORCE;
            }
            if (gameState === 'gameover') {
                resetGame();
            }
        }

        function gameOver() {
            gameState = 'gameover';
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('flappyBest', bestScore);
            }
            updateUI();
        }

        function addPipe() {
            const minY = 60;
            const maxY = H - GROUND_HEIGHT - PIPE_GAP - 60;
            const y = minY + Math.random() * (maxY - minY);
            pipes.push({
                x: W,
                y: y,
                scored: false
            });
        }

        // ========== ATUALIZAÇÃO ==========
        function update() {
            if (gameState !== 'playing') return;

            frameCount++;

            bird.vy += GRAVITY;
            bird.y += bird.vy;

            if (bird.vy < 0) {
                bird.rotation = -0.3;
            } else {
                bird.rotation = Math.min(bird.vy * 0.03, 0.7);
            }

            if (bird.y + bird.size > H - GROUND_HEIGHT) {
                bird.y = H - GROUND_HEIGHT - bird.size;
                gameOver();
                return;
            }

            if (bird.y - bird.size < 0) {
                bird.y = bird.size;
                bird.vy = 0;
            }

            if (frameCount % 90 === 0) {
                addPipe();
            }

            for (let i = pipes.length - 1; i >= 0; i--) {
                const pipe = pipes[i];
                pipe.x -= PIPE_SPEED;

                if (bird.x + bird.size > pipe.x && bird.x - bird.size < pipe.x + PIPE_WIDTH) {
                    if (bird.y - bird.size < pipe.y || bird.y + bird.size > pipe.y + PIPE_GAP) {
                        gameOver();
                        return;
                    }
                }

                if (!pipe.scored && bird.x > pipe.x + PIPE_WIDTH) {
                    pipe.scored = true;
                    score++;
                    updateUI();
                }

                if (pipe.x + PIPE_WIDTH < -50) {
                    pipes.splice(i, 1);
                }
            }
        }

        // ========== DESENHO ==========
        function draw() {
            ctx.clearRect(0, 0, W, H);

            // Céu
            const skyGrad = ctx.createLinearGradient(0, 0, 0, H - GROUND_HEIGHT);
            skyGrad.addColorStop(0, '#1a3a5a');
            skyGrad.addColorStop(0.5, '#2a6a8a');
            skyGrad.addColorStop(1, '#4a9aba');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, W, H - GROUND_HEIGHT);

            // Nuvens
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            for (let i = 0; i < 6; i++) {
                const x = (i * 120 + frameCount * 0.3) % 500 - 50;
                const y = 30 + i * 30;
                ctx.beginPath();
                ctx.arc(x, y, 30, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + 30, y - 10, 25, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + 60, y, 20, 0, Math.PI * 2);
                ctx.fill();
            }

            // Canos
            for (let pipe of pipes) {
                // Cano de cima
                ctx.fillStyle = '#2a8a3a';
                ctx.shadowColor = '#2a8a3a';
                ctx.shadowBlur = 10;
                ctx.fillRect(pipe.x, 0, PIPE_WIDTH, pipe.y);
                ctx.fillRect(pipe.x - 8, pipe.y - 20, PIPE_WIDTH + 16, 20);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#3aaa4a';
                ctx.fillRect(pipe.x + 4, pipe.y - 18, PIPE_WIDTH - 8, 6);
                ctx.fillRect(pipe.x + 10, 0, 4, pipe.y - 20);

                // Cano de baixo
                ctx.fillStyle = '#2a8a3a';
                ctx.shadowColor = '#2a8a3a';
                ctx.shadowBlur = 10;
                const bottomY = pipe.y + PIPE_GAP;
                ctx.fillRect(pipe.x, bottomY, PIPE_WIDTH, H - GROUND_HEIGHT - bottomY);
                ctx.fillRect(pipe.x - 8, bottomY, PIPE_WIDTH + 16, 20);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#3aaa4a';
                ctx.fillRect(pipe.x + 4, bottomY + 2, PIPE_WIDTH - 8, 6);
                ctx.fillRect(pipe.x + 10, bottomY + 20, 4, H - GROUND_HEIGHT - bottomY - 20);
            }

            // ===== PÁSSARO VERMELHO BONITO =====
            ctx.save();
            ctx.translate(bird.x, bird.y);
            ctx.rotate(bird.rotation);

            // Sombra
            ctx.shadowColor = 'rgba(255,50,50,0.3)';
            ctx.shadowBlur = 30;

            // Corpo (vermelho com gradiente)
            const grad = ctx.createRadialGradient(-4, -4, 2, 0, 0, bird.size);
            grad.addColorStop(0, '#ff6666');
            grad.addColorStop(0.5, '#ee2222');
            grad.addColorStop(1, '#aa0000');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.ellipse(0, 0, bird.size, bird.size * 0.8, 0, 0, Math.PI * 2);
            ctx.fill();

            // Brilho no corpo
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.beginPath();
            ctx.ellipse(-4, -6, bird.size * 0.35, bird.size * 0.25, -0.3, 0, Math.PI * 2);
            ctx.fill();

            // Asa (batendo)
            const wingY = Math.sin(frameCount * 0.15) * 4 - 2;
            ctx.fillStyle = '#cc1111';
            ctx.shadowColor = 'rgba(200,0,0,0.2)';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.ellipse(-2, -5 + wingY, bird.size * 0.55, bird.size * 0.3, -0.3, 0, Math.PI * 2);
            ctx.fill();
            // Detalhe da asa
            ctx.fillStyle = '#dd3333';
            ctx.beginPath();
            ctx.ellipse(-2, -5 + wingY, bird.size * 0.35, bird.size * 0.15, -0.3, 0, Math.PI * 2);
            ctx.fill();

            // Rabo
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#cc1111';
            ctx.beginPath();
            ctx.moveTo(-bird.size + 1, 0);
            ctx.lineTo(-bird.size - 10, -5);
            ctx.lineTo(-bird.size - 10, 5);
            ctx.closePath();
            ctx.fill();
            // Detalhe do rabo
            ctx.fillStyle = '#dd3333';
            ctx.beginPath();
            ctx.moveTo(-bird.size + 2, -1);
            ctx.lineTo(-bird.size - 6, -3);
            ctx.lineTo(-bird.size - 6, 3);
            ctx.closePath();
            ctx.fill();

            // Olho (branco)
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(7, -4, 6.5, 0, Math.PI * 2);
            ctx.fill();

            // Olho (preto - pupila)
            ctx.fillStyle = '#0a0a1a';
            ctx.beginPath();
            ctx.arc(9, -3, 3.5, 0, Math.PI * 2);
            ctx.fill();

            // Brilho no olho
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(9.5, -4.5, 1.5, 0, Math.PI * 2);
            ctx.fill();

            // Bico (laranja/vermelho)
            ctx.fillStyle = '#ff6633';
            ctx.shadowColor = 'rgba(255,100,50,0.3)';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.moveTo(12, 1);
            ctx.lineTo(20, 3);
            ctx.lineTo(12, 6);
            ctx.closePath();
            ctx.fill();
            // Detalhe do bico
            ctx.fillStyle = '#ff8844';
            ctx.beginPath();
            ctx.moveTo(13, 2);
            ctx.lineTo(17, 3);
            ctx.lineTo(13, 5);
            ctx.closePath();
            ctx.fill();

            // Sobrancelha (para dar expressão)
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#880000';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(3, -8);
            ctx.lineTo(8, -10);
            ctx.stroke();

            // Bochecha vermelha
            ctx.fillStyle = 'rgba(255,50,50,0.15)';
            ctx.beginPath();
            ctx.ellipse(5, 5, 5, 3, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.restore();

            // Chão
            const groundY = H - GROUND_HEIGHT;
            ctx.fillStyle = '#3a8a3a';
            ctx.fillRect(0, groundY, W, GROUND_HEIGHT);
            ctx.fillStyle = '#4aaa4a';
            ctx.fillRect(0, groundY, W, 8);

            ctx.fillStyle = 'rgba(255,255,255,0.05)';
            for (let i = 0; i < 20; i++) {
                const x = (i * 30 - frameCount * 1.5) % 600 - 50;
                ctx.fillRect(x, groundY + 20, 15, 3);
                ctx.fillRect(x + 10, groundY + 40, 15, 3);
                ctx.fillRect(x + 5, groundY + 60, 15, 3);
            }

            // Mensagem de início
            if (gameState === 'ready') {
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fillRect(0, 0, W, H);
                ctx.font = 'bold 40px "Courier New"';
                ctx.fillStyle = '#ff4444';
                ctx.shadowColor = '#ff0000';
                ctx.shadowBlur = 30;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🐦 FLAPPY', W/2, H/2 - 50);
                ctx.shadowBlur = 0;
                ctx.font = '20px "Courier New"';
                ctx.fillStyle = '#aabbdd';
                ctx.shadowBlur = 10;
                ctx.fillText('Pressione ESPAÇO', W/2, H/2 + 20);
                ctx.fillText('ou CLIQUE para começar', W/2, H/2 + 55);
                ctx.shadowBlur = 0;
            }

            // Game Over
            if (gameState === 'gameover') {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, W, H);
                ctx.font = 'bold 44px "Courier New"';
                ctx.fillStyle = '#ff4d6d';
                ctx.shadowColor = '#ff1a40';
                ctx.shadowBlur = 30;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('💀 GAME OVER', W/2, H/2 - 40);
                ctx.shadowBlur = 0;
                ctx.font = '24px "Courier New"';
                ctx.fillStyle = '#f7e05e';
                ctx.fillText(`Pontos: ${score}`, W/2, H/2 + 25);
                ctx.fillStyle = '#44ddff';
                ctx.fillText(`Recorde: ${bestScore}`, W/2, H/2 + 65);
                ctx.font = '16px "Courier New"';
                ctx.fillStyle = '#aabbdd';
                ctx.fillText('Clique ou ESPAÇO para recomeçar', W/2, H/2 + 115);
            }

            ctx.textAlign = 'start';
            ctx.textBaseline = 'alphabetic';
        }

        // ========== EVENTOS ==========
        canvas.addEventListener('click', jump);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });

        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                jump();
            }
            if (e.key === 'r' || e.key === 'R') resetGame();
        });

        document.getElementById('resetButton').addEventListener('click', resetGame);

        // ===== LOOP =====
        resetGame();
        bestSpan.textContent = bestScore;

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();

        canvas.setAttribute('tabindex', '0');
        canvas.focus();
    })();
</script>
</body>
</html>
